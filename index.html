<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>혜인관 강의실 예약</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f3f4f6;color:#222;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:#fff;border-bottom:1px solid #d5d8de}
.top-in{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font-size:18px;color:#1d3557;letter-spacing:-.3px}
.brand span{display:block;font-size:12px;color:#6b7280}
.user{font-size:13px;color:#444;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
nav.tabs{background:#fff;border-bottom:1px solid #d5d8de}
.tabs-in{max-width:1040px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:12px 14px;cursor:pointer;color:#555;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#1d3557;font-weight:700;border-bottom-color:#1d3557}
main{max-width:1040px;margin:0 auto;padding:16px}
.btn{border:1px solid #1d3557;background:#1d3557;color:#fff;border-radius:4px;padding:8px 14px;cursor:pointer}
.btn:hover{background:#16294a}
.btn.ghost{background:#fff;color:#1d3557}
.btn.ghost:hover{background:#eef1f6}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.danger{border-color:#9b2c2c;background:#fff;color:#9b2c2c}
.btn:disabled{background:#e5e7eb;border-color:#d1d5db;color:#9ca3af;cursor:not-allowed}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid #d5d8de;border-radius:4px;padding:12px;margin-bottom:12px}
.bar label{display:flex;flex-direction:column;font-size:12px;color:#555;gap:3px}
.bar select,.field input,.field select,.field textarea{border:1px solid #b9bfc9;border-radius:4px;padding:7px 8px;background:#fff;min-width:96px}
.bar .chk{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:#333;padding-bottom:8px}
.count{margin:0 0 10px;font-size:13px;color:#555}
.notice{background:#fff8e6;border:1px solid #e6cf8a;border-radius:4px;padding:9px 12px;margin-bottom:12px;font-size:13px;color:#5a4a12}
.notice ul{margin:4px 0 0;padding-left:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#555;margin-bottom:10px}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid #9aa3af;vertical-align:-2px;margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:#fff;border:1px solid #d5d8de;border-radius:4px;padding:12px}
.card h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .meta{font-size:12px;color:#6b7280;margin:2px 0 8px}
.badge{font-size:12px;font-weight:400;padding:2px 8px;border-radius:10px;border:1px solid}
.b-free{color:#1f6b3a;border-color:#8cc3a0;background:#eef8f1}
.b-class{color:#455468;border-color:#b6c0cd;background:#eef1f5}
.b-res{color:#7a5a00;border-color:#dcc27a;background:#fdf5dc}
.b-lock{color:#8a2b2b;border-color:#d9a4a4;background:#fbeeee}
.tl{position:relative;height:20px;background:#eef8f1;border:1px solid #b5d3bf;margin-top:4px}
.seg{position:absolute;top:0;bottom:0;border-left:1px solid #fff;border-right:1px solid #fff}
.seg.c{background:#c3ccd8}
.seg.r{background:#ecd48c}
.seg.n{background:#e3aaa0}
.seg.x{background:repeating-linear-gradient(45deg,#e6c9c9,#e6c9c9 4px,#f4e4e4 4px,#f4e4e4 8px)}
.nowline{position:absolute;top:-3px;bottom:-3px;width:2px;background:#c0392b}
.ticks{position:relative;height:14px;font-size:10px;color:#777}
.ticks span{position:absolute;transform:translateX(-50%)}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.card .tags{font-size:12px;color:#8a2b2b}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #d5d8de;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:middle}
th{background:#f0f2f5;font-size:12px;color:#444}
.tw{overflow-x:auto}
.st{font-weight:700}
.st.a{color:#1d3557}.st.b{color:#1f6b3a}.st.c{color:#6b7280}.st.d{color:#9b2c2c}
.panel{background:#fff;border:1px solid #d5d8de;border-radius:4px;padding:14px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:16px}
.empty{padding:28px;text-align:center;color:#777;background:#fff;border:1px solid #d5d8de}
.mask{position:fixed;inset:0;background:rgba(20,28,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:6px;width:100%;max-width:420px;padding:20px;border-top:4px solid #1d3557;max-height:100%;overflow:auto}
.modal h2{margin:0 0 12px;font-size:18px}
.modal ol{padding-left:20px;margin:0 0 16px}
.modal ol li{margin-bottom:8px}
.modal ol li small{display:block;color:#666}
.mbtn{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;font-size:13px;color:#444}
.field input,.field select,.field textarea{width:100%;font-size:15px}
.err{color:#9b2c2c;font-size:13px;min-height:18px;margin:2px 0}
.seg2{display:flex;margin-bottom:14px;border:1px solid #1d3557;border-radius:4px;overflow:hidden}
.seg2 button{flex:1;border:0;background:#fff;padding:8px;cursor:pointer;color:#1d3557}
.seg2 button.on{background:#1d3557;color:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;z-index:90;max-width:90%}
footer{max-width:1040px;margin:10px auto 40px;padding:0 16px;font-size:12px;color:#777;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer a{color:#555;cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
.hint{font-size:12px;color:#777}
.demo{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid #9aa3af;border-radius:4px;padding:12px;z-index:60;width:280px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.demo h4{margin:0 0 8px;font-size:14px}
.demo .q{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
@media(max-width:560px){.grid{grid-template-columns:1fr}.bar select{min-width:80px}}
</style>
</head>

<header class="top"><div class="top-in">
  <div class="brand"><b>혜인관 강의실 예약</b><span>빈 강의실 실시간 조회 · 예약 (창의문제해결프로젝트 시연용)</span></div>

</div></header>
<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
<main id="main"></main>
<footer>

  <button type="button" data-act="demo">시연 설정</button>
</footer>
<div id="layer"></div>
<div id="toast" class="toast" style="display:none"></div>

const todayKey=()=>dk(now());
const absTime=(date,m)=>{const d=parseDK(date);d.setHours(0,0,0,0);return d.getTime()+m*60000};

/* ---------- 저장소: 공유 DB가 있으면 공유, 없으면 이 브라우저에만 ---------- */
let S={users:{},res:{},notices:{}};
let store={mode:"local",db:null};
const LSKEY="hy_state_v1";
function loadLocal(){
  store.mode="local";
  try{const j=JSON.parse(localStorage.getItem(LSKEY)||"null");if(j&&j.users)S={users:j.users||{},res:j.res||{},notices:j.notices||{}}}catch(e){}
}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
const COL={users:"users",res:"reservations",notices:"notices"};
async function put(kind,id,obj){
  if(obj==null)delete S[kind][id];else S[kind][id]=obj;
  if(store.mode==="shared"){
    try{
      const d=store.db.collection(COL[kind]).doc(id);
      if(obj==null)await d.delete();else await d.set(JSON.parse(JSON.stringify(obj)));
    }catch(e){toast("서버 저장에 실패했습니다. 잠시 후 다시 시도해 주세요.")}
  }else saveLocal();
}
async function initStore(){
  let db=null;
  try{
    if(window.claude&&claude.use){
      db=await Promise.race([claude.use("db"),new Promise(r=>setTimeout(()=>r(null),4000))]);
    }
  }catch(e){db=null}
  if(!db){loadLocal();await seedAdmin();return}
  store.db=db;
  try{
    let got=0;
    const subscribe=kind=>db.collection(COL[kind]).onSnapshot(snap=>{
      const m={};
      const docs=snap.docs||[];
      docs.forEach(d=>{m[d.id]=typeof d.data==="function"?d.data():d});
      S[kind]=m;got++;
      if(got>=3&&!store.ready){store.ready=true;seedAdmin()}
      render();
    });
    store.mode="shared";
    ["users","res","notices"].forEach(subscribe);
    setTimeout(()=>{if(!store.ready){ // 공유 DB 응답이 없으면 로컬로 전환
      store.mode="local";loadLocal();seedAdmin();render()}},9000);
  }catch(e){loadLocal();await seedAdmin()}
}
async function sha(t){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hy:"+t));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){return "p:"+t}
}
async function seedAdmin(){
  if(S.users.admin)return;
  await put("users","admin",{id:"admin",name:"관리자",pw:await sha("admin1234"),admin:true,created:Date.now()});
}

/* ---------- 도메인 로직 ---------- */
function weekdayOf(date){return parseDK(date).getDay()}
function activeRes(r){return r.status==="예약됨"||r.status==="이용중"}
function conflict(room,date,s,e,ignoreId){
  const wd=weekdayOf(date);
  for(const c of CLASSES[room]||[])if(c.day===wd&&c.s<e&&s<c.e)return "수업 시간표와 겹칩니다 ("+c.name+")";
  for(const r of Object.values(S.res))if(r.id!==ignoreId&&r.room===room&&r.date===date&&activeRes(r)&&r.s<e&&s<r.e)return "이미 예약된 시간입니다";
  for(const n of Object.values(S.notices))if(n.room===room&&n.date===date&&n.s<e&&s<n.e)return "특강/시간표 변경으로 사용할 수 없습니다 ("+n.title+")";
  return null;
}
function segmentsOf(room,date){
  const wd=weekdayOf(date),out=[];
  (CLASSES[room]||[]).forEach(c=>{if(c.day===wd)out.push({t:"c",s:c.s,e:c.e,label:c.name})});
  Object.values(S.res).forEach(r=>{if(r.room===room&&r.date===date&&activeRes(r))out.push({t:"r",s:r.s,e:r.e,label:"예약"})});
  Object.values(S.notices).forEach(n=>{if(n.room===room&&n.date===date)out.push({t:"n",s:n.s,e:n.e,label:n.title})});
  return out;
}
function statusNow(room,date){
  if(RESTRICTED.includes(room))return {cls:"b-lock",txt:"학과 전용"};
  if(date!==todayKey())return {cls:"b-free",txt:"예약 가능"};
  const m=nowMin();
  const seg=segmentsOf(room,date).find(g=>g.s<=m&&m<g.e);
  if(!seg)return {cls:"b-free",txt:"비어 있음"};
  if(seg.t==="c")return {cls:"b-class",txt:"수업 중"};
  if(seg.t==="r")return {cls:"b-res",txt:"예약 중"};
  return {cls:"b-lock",txt:"특강/변경"};
}
function blockedUntil(uid){
  const ns=Object.values(S.res).filter(r=>r.uid===uid&&r.status==="노쇼");
  if(ns.length<NOSHOW_LIMIT)return null;
  const last=Math.max(...ns.map(r=>absTime(r.date,r.e)));
  const until=last+BLOCK_DAYS*86400000;
  return now().getTime()<until?until:null;
}
let ticking=false;
async function tickStatus(){
  if(ticking)return;ticking=true;
  try{
    const t=now().getTime();
    for(const r of Object.values(S.res)){
      if(r.status==="예약됨"&&t>absTime(r.date,r.s)+CHECKIN_GRACE*60000){
        await put("res",r.id,{...r,status:"노쇼",note:"입실 시작 후 "+CHECKIN_GRACE+"분 내 미체크인으로 자동 취소"});
      }else if(r.status==="이용중"&&t>absTime(r.date,r.e)){
        await put("res",r.id,{...r,status:"완료"});
      }
    }
  }finally{ticking=false}
  render(true);
}

/* ---------- UI 상태 ---------- */
const U={tab:"search",date:null,floor:"",fs:"",fe:"",freeOnly:false,me:null,modal:null,demo:false};
try{U.me=sessionStorage.getItem("hy_me")}catch(e){}
function defaultDate(){const n=now();return nowMin()>1110?dk(new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)):dk(n)}
function me(){return U.me&&S.users[U.me]?S.users[U.me]:null}
function dateOptions(){const n=now(),o=[];for(let i=0;i<14;i++)o.push(dk(new Date(n.getFullYear(),n.getMonth(),n.getDate()+i)));return o}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2600)}

/* ---------- 렌더 ---------- */
function render(soft){
  if(!U.date||!dateOptions().includes(U.date))U.date=defaultDate();
  const m=me();
  $("#userbox").innerHTML=m?`<span>${esc(m.name)} (${esc(m.id)})</span><button class="btn ghost sm" data-act="logout">로그아웃</button>`
    :`<button class="btn ghost sm" data-act="login">로그인</button><button class="btn sm" data-act="signup">회원가입</button>`;
  const tabs=[["search","빈 강의실 조회"],["mine","예약 내역"]];
  if(m&&m.admin)tabs.push(["admin","관리자"]);
  if(!tabs.some(t=>t[0]===U.tab))U.tab="search";
  $("#tabs").innerHTML=tabs.map(t=>`<button class="tab ${U.tab===t[0]?"on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("");
  const html=U.tab==="search"?viewSearch():U.tab==="mine"?viewMine():viewAdmin();
  const M=$("#main");
  if(M.dataset.sig!==html){
    const keep=snapshotInputs(M);
    M.innerHTML=html;M.dataset.sig=html;
    restoreInputs(M,keep);
  }
  renderLayer();
}
function bar(room,date){
  const segs=segmentsOf(room,date);
  const pct=m=>((m-DAY_START)/(DAY_END-DAY_START)*100);
  let h='<div class="tl">';
  if(RESTRICTED.includes(room))h+=`<div class="seg x" style="left:0;width:100%"></div>`;
  segs.forEach(g=>{const s=Math.max(g.s,DAY_START),e=Math.min(g.e,DAY_END);if(e>s)h+=`<div class="seg ${g.t}" style="left:${pct(s)}%;width:${pct(e)-pct(s)}%" title="${esc(fmt(g.s)+"-"+fmt(g.e)+" "+g.label)}"></div>`});
  if(date===todayKey()){const m=nowMin();if(m>=DAY_START&&m<=DAY_END)h+=`<div class="nowline" style="left:${pct(m)}%"></div>`}
  h+='</div><div class="ticks">';
  for(let t=9;t<=19;t+=2)h+=`<span style="left:${pct(t*60)}%">${t}</span>`;
  return h+"</div>";
}
function viewSearch(){
  const date=U.date,fs=U.fs===""?null:+U.fs,fe=U.fe===""?null:+U.fe;
  const tOpts=[];for(let m=DAY_START;m<=DAY_END;m+=30)tOpts.push(m);
  let list=ROOMS.filter(r=>!U.floor||floorOf(r)===U.floor);
  const rangeSet=fs!=null&&fe!=null&&fe>fs;
  const info=r=>{
    if(RESTRICTED.includes(r))return {ok:false};
    if(rangeSet)return {ok:!conflict(r,date,fs,fe)};
    return {ok:true};
  };
  if(rangeSet||U.freeOnly){
    list=list.filter(r=>{
      if(RESTRICTED.includes(r))return false;
      if(rangeSet&&conflict(r,date,fs,fe))return false;
      if(U.freeOnly&&date===todayKey()&&statusNow(r,date).txt!=="비어 있음")return false;
      return true;
    });
  }
  const avail=list.filter(r=>!RESTRICTED.includes(r)).length;
  const notices=Object.values(S.notices).filter(n=>n.date===date);
  let h=`<div class="notice"><b>안내</b> 특강 등으로 시간표가 변경될 수 있으니 이용 전 한 번 더 확인해 주세요.`;
  if(notices.length)h+="<ul>"+notices.map(n=>`<li>${esc(roomName(n.room))} ${esc(dayLabel(n.date))} ${fmt(n.s)}~${fmt(n.e)} · ${esc(n.title)}</li>`).join("")+"</ul>";
  h+="</div>";
  h+=`<div class="bar">
    <label>날짜<select id="f-date" data-f="date">${dateOptions().map(d=>`<option value="${d}" ${d===date?"selected":""}>${dayLabel(d)}${d===todayKey()?" 오늘":""}</option>`).join("")}</select></label>
    <label>층<select id="f-floor" data-f="floor"><option value="">전체</option>${FLOORS.map(f=>`<option ${f===U.floor?"selected":""}>${f}</option>`).join("")}</select></label>
    <label>시작<select id="f-fs" data-f="fs"><option value="">전체</option>${tOpts.slice(0,-1).map(m=>`<option value="${m}" ${U.fs!==""&&+U.fs===m?"selected":""}>${fmt(m)}</option>`).join("")}</select></label>
    <label>종료<select id="f-fe" data-f="fe"><option value="">전체</option>${tOpts.slice(1).map(m=>`<option value="${m}" ${U.fe!==""&&+U.fe===m?"selected":""}>${fmt(m)}</option>`).join("")}</select></label>
    <label class="chk"><input type="checkbox" id="f-free" data-f="freeOnly" ${U.freeOnly?"checked":""}> 지금 비어 있는 방만</label>
  </div>`;
  h+=`<div class="legend"><span><i style="background:#eef8f1"></i>빈 시간</span><span><i style="background:#c3ccd8"></i>수업</span><span><i style="background:#ecd48c"></i>예약</span><span><i style="background:#e3aaa0"></i>특강/변경</span><span><i style="background:#f4e4e4"></i>학과 전용</span></div>`;
  h+=`<p class="count">${dayLabel(date)} 기준 · 예약 가능한 강의실 ${avail}개${rangeSet?" ("+fmt(fs)+"~"+fmt(fe)+" 비어 있음)":""}</p>`;
  if(!list.length)return h+`<div class="empty">조건에 맞는 강의실이 없습니다.</div>`;
  h+='<div class="grid">';
  list.forEach(r=>{
    const st=statusNow(r,date),lock=RESTRICTED.includes(r);
    const ns=notices.filter(n=>n.room===r);
    h+=`<div class="card"><h3>${esc(roomName(r))}<span class="badge ${st.cls}">${st.txt}</span></h3>
      <div class="meta">혜인관 ${esc(floorOf(r))}${lock?" · 특정 학과 전용 강의실":""}</div>${bar(r,date)}
      <div class="row"><span class="tags">${ns.length?"특강/시간표 변경 있음":""}</span>
      ${lock?`<button class="btn" disabled>예약 불가</button>`:`<button class="btn" data-act="book" data-room="${esc(r)}">예약하기</button>`}</div></div>`;
  });
  return h+"</div>";
}
const STCLS={"예약됨":"a","이용중":"b","완료":"c","취소":"c","노쇼":"d","관리자취소":"d","노쇼해제":"c"};
function resRows(arr,admin){
  return arr.map(r=>{
    const t=now().getTime(),st=absTime(r.date,r.s);
    let act="";
    if(r.status==="예약됨"){
      const can=t>=st&&t<=st+CHECKIN_GRACE*60000;
      if(!admin)act+=`<button class="btn sm" data-act="checkin" data-id="${r.id}" ${can?"":"disabled"}>체크인</button> `;
      act+=`<button class="btn sm danger" data-act="${admin?"force":"cancel"}" data-id="${r.id}">${admin?"강제 취소":"취소"}</button>`;
      if(!admin&&!can)act+=`<div class="hint">체크인 ${fmt(r.s)}~${fmt(r.s+CHECKIN_GRACE)}</div>`;
    }
    const label=r.status==="관리자취소"?"관리자 취소":r.status;
    return `<tr><td>${dayLabel(r.date)}</td>${admin?`<td>${esc(r.uname)}<div class="hint">${esc(r.uid)}</div></td>`:""}<td>${esc(roomName(r.room))}</td><td>${fmt(r.s)}~${fmt(r.e)}</td><td>${esc(r.purpose||"-")}</td><td><span class="st ${STCLS[r.status]||"c"}">${esc(label)}</span>${r.note?`<div class="hint">${esc(r.note)}</div>`:""}</td><td>${act}</td></tr>`;
  }).join("");
}
const sortRes=a=>a.sort((x,y)=>absTime(y.date,y.s)-absTime(x.date,x.s));
function viewMine(){
  const m=me();
  if(!m)return `<div class="empty">예약 내역은 로그인 후 확인할 수 있습니다.<br><br><button class="btn" data-act="login">로그인</button></div>`;
  const arr=sortRes(Object.values(S.res).filter(r=>r.uid===m.id));
  const ns=arr.filter(r=>r.status==="노쇼").length,bu=blockedUntil(m.id);
  let h="";
  if(bu)h+=`<div class="notice" style="background:#fbeeee;border-color:#d9a4a4;color:#7a2222">노쇼가 ${NOSHOW_LIMIT}회 이상 누적되어 ${dayLabel(dk(new Date(bu)))}까지 예약이 제한됩니다.</div>`;
  else if(ns)h+=`<div class="notice">노쇼 ${ns}회 누적 (${NOSHOW_LIMIT}회 이상이면 ${BLOCK_DAYS}일간 예약이 제한됩니다)</div>`;
  if(!arr.length)return h+`<div class="empty">예약 내역이 없습니다.</div>`;
  return h+`<div class="tw"><table><thead><tr><th>날짜</th><th>강의실</th><th>시간</th><th>사용 목적</th><th>상태</th><th></th></tr></thead><tbody>${resRows(arr,false)}</tbody></table></div>`;
}

   <div class="bar" style="border:0;padding:0;margin:0">

    <label>날짜<select id="a-date">${dateOptions().map(d=>`<option value="${d}">${dayLabel(d)}</option>`).join("")}</select></label>

    <label style="flex:1;min-width:160px">내용<input id="a-t" placeholder="예: 외부 초청 특강" style="border:1px solid #b9bfc9;border-radius:4px;padding:7px 8px"></label>
    <button class="btn" data-act="addnotice">등록</button></div>

  h+=`<div class="panel"><h2>전체 예약 현황</h2>${arr.length?`<div class="tw"><table><thead><tr><th>날짜</th><th>예약자</th><th>강의실</th><th>시간</th><th>사용 목적</th><th>상태</th><th></th></tr></thead><tbody>${resRows(arr,true)}</tbody></table></div>`:`<p class="hint">예약이 없습니다.</p>`}</div>`;
  const users=Object.values(S.users).filter(u=>!u.admin);
  h+=`<div class="panel"><h2>회원 · 노쇼 현황</h2>${users.length?`<div class="tw"><table><thead><tr><th>이름</th><th>아이디</th><th>노쇼</th><th></th></tr></thead><tbody>${users.map(u=>{const c=Object.values(S.res).filter(r=>r.uid===u.id&&r.status==="노쇼").length;return `<tr><td>${esc(u.name)}</td><td>${esc(u.id)}</td><td>${c}회${blockedUntil(u.id)?" (예약 제한 중)":""}</td><td>${c?`<button class="btn sm ghost" data-act="clearns" data-id="${esc(u.id)}">노쇼 기록 해제</button>`:""}</td></tr>`}).join("")}</tbody></table></div>`:`<p class="hint">가입한 회원이 없습니다.</p>`}</div>`;
  return h;
}

/* ---------- 모달 ---------- */
function renderLayer(){
  const L=$("#layer"),m=U.modal;let h="";
  if(m){
    if(m.type==="notice")h=`<div class="mask"><div class="modal" role="dialog" aria-modal="true"><h2>이용 전 꼭 확인해 주세요</h2>
      <ol><li><b>예약하고 노쇼 금지</b><small>예약 시작 후 ${CHECKIN_GRACE}분 안에 체크인하지 않으면 자동 취소되고 노쇼로 기록됩니다.</small></li>
      <li><b>예약되어 있는 방 사용 금지</b><small>다른 사람이 예약한 시간에는 해당 강의실을 사용할 수 없습니다.</small></li>
      <li><b>특강 등 시간표 변경 가능성 있음</b><small>갑작스러운 일정 변경이 있을 수 있으니 이용 전 다시 확인해 주세요.</small></li></ol>
      <div class="mbtn"><button class="btn" data-act="closem">닫기</button></div></div></div>`;
    else if(m.type==="auth")h=authHtml(m);
    else if(m.type==="book")h=bookHtml(m);
  }
  if(U.demo)h+=demoHtml();
  if(L.dataset.sig===h)return;
  const keep=snapshotInputs(L);
  L.innerHTML=h;L.dataset.sig=h;
  restoreInputs(L,keep);
}
// 주기적 갱신 때 입력 중인 내용과 포커스가 사라지지 않도록 보존
function snapshotInputs(root){
  const f=document.activeElement&&root.contains(document.activeElement)?document.activeElement:null;
  const vals={};
  root.querySelectorAll("input[id],textarea[id]").forEach(e=>{if(e.type!=="checkbox")vals[e.id]=e.value});
  root.querySelectorAll("select[id^=a-]").forEach(e=>{vals[e.id]=e.value});
  return {vals,focus:f&&f.id,pos:f&&f.selectionStart};
}
function restoreInputs(root,k){
  for(const id in k.vals){const el=root.querySelector("#"+id);if(el&&el.tagName!=="SELECT"?true:el&&el.querySelector('option[value="'+k.vals[id]+'"]'))el.value=k.vals[id]}
  if(k.focus){const el=root.querySelector("#"+k.focus);if(el){el.focus();try{if(k.pos!=null)el.setSelectionRange(k.pos,k.pos)}catch(e){}}}
}
function authHtml(m){
  const su=m.mode==="signup";
  return `<div class="mask"><div class="modal" role="dialog" aria-modal="true"><h2>${su?"회원가입":"로그인"}</h2>
   <p class="hint" style="margin:-6px 0 12px">${m.why||"강의실 예약은 로그인 후 이용할 수 있습니다."}</p>
   <div class="seg2"><button data-act="authmode" data-mode="login" class="${su?"":"on"}">로그인</button><button data-act="authmode" data-mode="signup" class="${su?"on":""}">회원가입</button></div>
   ${su?`<div class="field"><label for="u-name">이름</label><input id="u-name" autocomplete="name" maxlength="12"></div>`:""}
   <div class="field"><label for="u-id">아이디${su?" (영문·숫자·_ 4~20자)":""}</label><input id="u-id" autocomplete="username" maxlength="20" autocapitalize="none"></div>
   <div class="field"><label for="u-pw">비밀번호${su?" (4자 이상)":""}</label><input id="u-pw" type="password" autocomplete="${su?"new-password":"current-password"}"></div>
   ${su?`<div class="field"><label for="u-pw2">비밀번호 확인</label><input id="u-pw2" type="password" autocomplete="new-password"></div>`:""}
   <div class="err" id="auth-err">${esc(m.err||"")}</div>
   <div class="mbtn"><button class="btn ghost" data-act="closem">취소</button><button class="btn" data-act="${su?"dosignup":"dologin"}">${su?"가입하기":"로그인"}</button></div></div></div>`;
}
function freeStarts(room,date){
  const out=[],n=nowMin(),today=date===todayKey();
  for(let s=DAY_START;s<DAY_END;s+=30){if(today&&s<n)continue;if(!conflict(room,date,s,s+30))out.push(s)}
  return out;
}
function maxEnd(room,date,s){let e=s+30;while(e+30<=DAY_END&&!conflict(room,date,s,e+30))e+=30;return e}
function bookHtml(m){
  const starts=freeStarts(m.room,m.date);
  if(m.s==null||!starts.includes(m.s))m.s=starts[0];
  const mx=m.s!=null?maxEnd(m.room,m.date,m.s):null;
  if(m.s!=null&&(m.e==null||m.e<=m.s||m.e>mx))m.e=Math.min(m.s+60,mx);
  const ends=[];if(m.s!=null)for(let e=m.s+30;e<=mx;e+=30)ends.push(e);
  return `<div class="mask"><div class="modal" role="dialog" aria-modal="true"><h2>${esc(roomName(m.room))} 예약</h2>
   <div class="field"><label for="b-date">날짜</label><select id="b-date">${dateOptions().map(d=>`<option value="${d}" ${d===m.date?"selected":""}>${dayLabel(d)}</option>`).join("")}</select></div>
   <div class="tl-wrap">${bar(m.room,m.date)}</div>
   ${starts.length?`<div style="display:flex;gap:10px;margin-top:6px"><div class="field" style="flex:1"><label for="b-s">시작</label><select id="b-s">${starts.map(s=>`<option value="${s}" ${s===m.s?"selected":""}>${fmt(s)}</option>`).join("")}</select></div>
   <div class="field" style="flex:1"><label for="b-e">종료</label><select id="b-e">${ends.map(e=>`<option value="${e}" ${e===m.e?"selected":""}>${fmt(e)}</option>`).join("")}</select></div></div>
   <div class="field"><label for="b-p">사용 목적</label><input id="b-p" maxlength="30" placeholder="예: 팀플 회의, 스터디, 시험 준비" value="${esc(m.purpose||"")}"></div>
   <p class="hint">예약 시작 시각부터 ${CHECKIN_GRACE}분 안에 체크인해야 합니다.</p>`
   :`<div class="empty" style="margin:10px 0">이 날짜에는 예약 가능한 시간이 없습니다.</div>`}
   <div class="err" id="b-err">${esc(m.err||"")}</div>
   <div class="mbtn"><button class="btn ghost" data-act="closem">닫기</button>${starts.length?`<button class="btn" data-act="dobook">예약하기</button>`:""}</div></div></div>`;
}
function demoHtml(){
  const n=now(),v=n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate())+"T"+pad(n.getHours())+":"+pad(n.getMinutes());
  return `<div class="demo"><h4>시연용 시간 설정</h4>
   <div class="hint">현재 사이트 시간: ${dayLabel(dk(n))} ${pad(n.getHours())}:${pad(n.getMinutes())}${offsetMs?" (조정됨)":""}</div>
   <div class="q"><button class="btn sm ghost" data-act="shift" data-min="10">+10분</button><button class="btn sm ghost" data-act="shift" data-min="11">+11분</button><button class="btn sm ghost" data-act="shift" data-min="60">+1시간</button></div>
   <input type="datetime-local" id="d-dt" value="${v}" style="width:100%;border:1px solid #b9bfc9;border-radius:4px;padding:6px">
   <div class="q"><button class="btn sm" data-act="setdt">이 시간으로</button><button class="btn sm ghost" data-act="realtime">실제 시간</button><button class="btn sm ghost" data-act="closedemo">닫기</button></div>
   <div class="hint">발표에서 체크인 시간 제한과 노쇼 자동 취소를 바로 보여주기 위한 기능입니다.</div></div>`;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click",async e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){const t=tab.dataset.tab;if(t==="mine"&&!me()){openAuth("login",{after:{tab:"mine"},why:"예약 내역은 로그인 후 확인할 수 있습니다."});return}U.tab=t;render();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,m=U.modal;
  if(a==="closem"){U.modal=null;render()}
  else if(a==="login")openAuth("login");
  else if(a==="signup")openAuth("signup");
  else if(a==="authmode"){m.mode=b.dataset.mode;m.err="";render()}
  else if(a==="logout"){U.me=null;try{sessionStorage.removeItem("hy_me")}catch(x){}U.tab="search";render();toast("로그아웃되었습니다.")}
  else if(a==="dosignup")await doSignup();
  else if(a==="dologin")await doLogin();
  else if(a==="book"){
    if(!me()){openAuth("login",{after:{book:b.dataset.room},why:"강의실 예약은 로그인 후 이용할 수 있습니다."});return}
    openBook(b.dataset.room);
  }
  else if(a==="dobook")await doBook();
  else if(a==="cancel"){const r=S.res[id];if(r&&r.status==="예약됨"){await put("res",id,{...r,status:"취소"});toast("예약을 취소했습니다.");render()}}
  else if(a==="force"){const r=S.res[id];if(r&&r.status==="예약됨"){await put("res",id,{...r,status:"관리자취소",note:"관리자에 의해 취소됨"});render()}}
  else if(a==="checkin"){
    const r=S.res[id],t=now().getTime(),st=r?absTime(r.date,r.s):0;
    if(r&&r.status==="예약됨"&&t>=st&&t<=st+CHECKIN_GRACE*60000){await put("res",id,{...r,status:"이용중",checkedIn:true});toast("체크인되었습니다. 이용 후 정리해 주세요.");render()}
    else{toast("체크인 가능 시간이 아닙니다.");await tickStatus()}
  }
  else if(a==="addnotice")await addNotice();
  else if(a==="delnotice"){await put("notices",id,null);render()}
  else if(a==="clearns"){for(const r of Object.values(S.res))if(r.uid===id&&r.status==="노쇼")await put("res",r.id,{...r,status:"노쇼해제"});render()}
  else if(a==="demo"){U.demo=true;render()}
  else if(a==="closedemo"){U.demo=false;render()}
  else if(a==="shift"){setOffset(offsetMs+Number(b.dataset.min)*60000);}
  else if(a==="setdt"){const v=$("#d-dt").value;if(v){setOffset(new Date(v).getTime()-Date.now())}}
  else if(a==="realtime")setOffset(0);
});
function setOffset(ms){offsetMs=ms;try{localStorage.setItem("hy_offset",String(ms))}catch(e){}tickStatus()}
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){const k=t.dataset.f;U[k]=t.type==="checkbox"?t.checked:t.value;render();return}
  const m=U.modal;
  if(m&&m.type==="book"){
    if(t.id==="b-date"){m.date=t.value;m.s=null;m.e=null;m.err="";m.purpose=($("#b-p")||{}).value||m.purpose;render()}
    else if(t.id==="b-s"){m.s=+t.value;m.e=null;m.purpose=($("#b-p")||{}).value||"";render()}
    else if(t.id==="b-e"){m.e=+t.value}
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&U.modal&&U.modal.type==="auth"&&e.target.tagName==="INPUT")$("#layer [data-act^=do]").click();
  if(e.key==="Escape"&&U.modal&&U.modal.type!=="notice"){U.modal=null;render()}
});
function openAuth(mode,opt){U.modal={type:"auth",mode,err:"",after:(opt||{}).after,why:(opt||{}).why};render();setTimeout(()=>{const el=$("#u-id");if(el)el.focus()},0)}
function authErr(t){U.modal.err=t;const el=$("#auth-err");if(el)el.textContent=t}
async function doSignup(){
  const name=$("#u-name").value.trim(),id=$("#u-id").value.trim().toLowerCase(),pw=$("#u-pw").value,pw2=$("#u-pw2").value;
  if(!name)return authErr("이름을 입력해 주세요.");
  if(!/^[a-z0-9_]{4,20}$/.test(id))return authErr("아이디는 영문, 숫자, _ 4~20자로 입력해 주세요.");
  if(S.users[id])return authErr("이미 사용 중인 아이디입니다.");
  if(pw.length<4)return authErr("비밀번호는 4자 이상이어야 합니다.");
  if(pw!==pw2)return authErr("비밀번호 확인이 일치하지 않습니다.");
  await put("users",id,{id,name,pw:await sha(pw),admin:false,created:Date.now()});
  finishLogin(id,"가입이 완료되었습니다.");
}
async function doLogin(){
  const id=$("#u-id").value.trim().toLowerCase(),pw=$("#u-pw").value,u=S.users[id];
  if(!u||u.pw!==await sha(pw))return authErr("아이디 또는 비밀번호가 올바르지 않습니다.");
  finishLogin(id,u.name+"님, 환영합니다.");
}
function finishLogin(id,msg){
  const after=U.modal&&U.modal.after;
  U.me=id;try{sessionStorage.setItem("hy_me",id)}catch(e){}
  U.modal=null;
  if(after&&after.tab)U.tab=after.tab;
  if(after&&after.book){U.tab="search";openBook(after.book)}else render();
  toast(msg);
}
function openBook(room){U.modal={type:"book",room,date:U.date,s:null,e:null,purpose:"",err:""};render()}
async function doBook(){
  const m=U.modal,u=me();if(!u)return;
  const s=+$("#b-s").value,e=+$("#b-e").value,purpose=$("#b-p").value.trim();
  const bu=blockedUntil(u.id);
  const fail=t=>{m.err=t;m.purpose=purpose;m.s=s;m.e=e;render()};
  if(bu)return fail("노쇼 누적으로 "+dayLabel(dk(new Date(bu)))+"까지 예약할 수 없습니다.");
  if(m.date===todayKey()&&s<nowMin())return fail("이미 지난 시간입니다.");
  const c=conflict(m.room,m.date,s,e);
  if(c)return fail(c);
  const id="r"+uid8();
  await put("res",id,{id,uid:u.id,uname:u.name,room:m.room,date:m.date,s,e,purpose,status:"예약됨",checkedIn:false,created:Date.now()});
  U.modal=null;U.tab="mine";render();toast("예약이 완료되었습니다. 시작 후 "+CHECKIN_GRACE+"분 안에 체크인해 주세요.");
}
async function addNotice(){
  const room=$("#a-room").value,date=$("#a-date").value,s=+$("#a-s").value,e=+$("#a-e").value,title=$("#a-t").value.trim();
  const er=t=>{$("#a-err").textContent=t};
  if(!title)return er("내용을 입력해 주세요.");
  if(e<=s)return er("종료 시간이 시작보다 늦어야 합니다.");
  const id="n"+uid8();
  await put("notices",id,{id,room,date,s,e,title});
  // 해당 시간에 이미 잡힌 예약은 관리자가 확인할 수 있도록 표시만 하고 유지
  toast("등록되었습니다.");render();
}

/* ---------- 시작 ---------- */
(async function(){
  U.modal={type:"notice"};
  render();
  await initStore();
  render();
  setInterval(tickStatus,5000);
  tickStatus();
})();
</script>
</body>
</html>
